[project]
name = "lean-meta-hackathon"
version = "1.0.0"
description = "Project LEAN: Sub-2-Bit Knapsack Compression & 8.00 GiB Runtime for Meta Muse-Glimmer-30B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "psutil>=6.0.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "campaigns/rigorous_benchmarks/benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py311"
